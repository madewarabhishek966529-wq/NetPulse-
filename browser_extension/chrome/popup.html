<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NetPulse Integration</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="card">
    <div class="header">
      <div class="brand">
        <div class="logo-glow"></div>
        <img src="icons/icon32.png" alt="NetPulse Logo" class="logo">
        <div>
          <h1 class="title">NetPulse</h1>
          <p class="tagline">Download Smarter. Download Faster.</p>
        </div>
      </div>
      <div class="status-badge" id="engineStatus">
        <span class="status-dot"></span> Checking...
      </div>
    </div>

    <div class="divider"></div>

    <div class="toggle-row">
      <div class="toggle-info">
        <span class="toggle-label">Automatic Interception</span>
        <span class="toggle-desc">Capture browser downloads automatically</span>
      </div>
      <label class="switch">
        <input type="checkbox" id="interceptToggle" checked>
        <span class="slider round"></span>
      </label>
    </div>

    <div class="divider"></div>

    <div class="input-group">
      <label for="extInput" class="input-label">Intercepted File Extensions</label>
      <input type="text" id="extInput" class="text-input" placeholder="exe, zip, rar, iso, mp4, etc.">
      <span class="input-hint">Comma separated list</span>
    </div>

    <div style="display: flex; gap: 8px; margin-top: 10px;">
      <button id="saveBtn" class="primary-btn" style="flex: 1;">Save Preferences</button>
      <button id="analyzeTabBtn" class="secondary-btn" style="flex: 1; background: rgba(0, 240, 255, 0.12); color: #00F0FF; border: 1px solid rgba(0, 240, 255, 0.4); border-radius: 8px; font-weight: 600; cursor: pointer; padding: 10px;">Analyze Tab</button>
    </div>

    <div class="footer">
      <span class="version">v1.0.0</span>
      <span class="info" id="connectionInfo">FastAPI & Native Bridge</span>
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
